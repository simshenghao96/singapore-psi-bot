name: Send PSI Update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: psi-update
  cancel-in-progress: false

jobs:
  send-psi:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download latest code and saved state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests matplotlib tzdata

      - name: Check PSI and send updates and charts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python psi_bot.py

      - name: Save successful message and report state
        if: ${{ always() }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in last_sent_psi.txt psi_reports.json; do
            if [ -f "$file" ]; then
              git add -- "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No state change to save."
            exit 0
          fi

          git commit -m "Record sent PSI updates and charts"

          for attempt in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            git pull --rebase origin "$DEFAULT_BRANCH" || exit 1
          done

          echo "Could not save state to GitHub. A later run may repeat a message."
          exit 1
